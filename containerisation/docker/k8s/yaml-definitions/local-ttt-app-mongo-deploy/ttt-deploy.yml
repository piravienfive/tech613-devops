apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttt-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ttt
  template:
    metadata:
      labels:
        app: ttt
    spec:
      containers:
        - name: ttt
          image: piravienfive/tech613-ttt:1.0
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/posts"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
